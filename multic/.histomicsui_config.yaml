---
annotationGroups:
  # If replaceGroups isn't present or false, groups will be merged with
  # existing groups.  Those that have the same name will be updated.  If
  # true, then all existing groups are removed.
  replaceGroups: true
  # The name of the default group.  If an existing annotation does not have
  # a group, it will be given this group name.
  defaultGroup: default
  groups:
    -
      # The id is required.
      id: default
      # The fillColor and lineColor are of the form
      # "rgb(<red>, <green>, <blue>)" or
      # "rgba(<red>, <green>, <blue>, <alpha>)"
      # where the colors are on a scale of 0 to 255 and the alpha is from
      # 0 to 1.
      fillColor: rgba(0,0,0,0)
      lineColor: rgb(0,0,0)
      # Label is optional.
      label: Default group
      # hotkey is optional
      # lineWidth is in pixels
      lineWidth: 2
    -
      id: cortical_interstitium
      label: Cortical interstitium
      hotkey: c
      fillColor: rgba(0, 255, 128, 0.1)
      lineColor: rgb(0, 255, 128)
      lineWidth: 4
    -
      id: medullary_interstitium
      label: Medullary interstitium
      hotkey: m
      fillColor: rgba(0, 255, 255, 0.1)
      lineColor: rgb(0, 255, 255)
      lineWidth: 4
    -
      id: non_globally_sclerotic_glomeruli
      label: Healthy glomeruli
      hotkey: n
      fillColor: rgba(255, 255, 0, 0.2)
      lineColor: rgb(255, 255, 0)
      lineWidth: 4
    -
      id: globally_sclerotic_glomeruli
      label: Sclerotic glomeruli
      hotkey: g
      fillColor: rgba(255, 128, 0, 0.2)
      lineColor: rgb(255, 128, 0)
      lineWidth: 4
    -
      id: tubules
      label: Tubules
      hotkey: t
      fillColor: rgba(255, 0, 0, 0.2)
      lineColor: rgb(255, 0, 0)
      lineWidth: 4
    -
      id: arteries/arterioles
      label: Arteries/arterioles
      hotkey: a
      fillColor: rgba(0, 0, 255, 0.2)
      lineColor: rgb(0, 0, 255)
      lineWidth: 4
    -
      id: intimal_fibrosis
      label: Arterial intimal fibrosis
      hotkey: c
      fillColor: rgba(0, 102, 0, 0.2)
      lineColor: rgb(0, 102, 0)
      lineWidth: 4
